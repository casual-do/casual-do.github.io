  function applyToolbarHidden() {
    document.querySelectorAll('#header [data-hide-key]').forEach(el => {
      const key = el.getAttribute('data-hide-key');
      el.classList.toggle('tb-hidden', !!tbHidden[key]);
    });
  }

  function initToolbarHide() {
    const btn   = document.getElementById('tb-hide-btn');
    const panel = document.getElementById('tb-hide-panel');
    if (!btn || !panel) return;

    const itemOrder = ['theme', 'font', 'weather', 'expired', 'spborder', 'sponly'];
    const items = Array.from(document.querySelectorAll('#header [data-hide-key]'))
      .map(el => ({
        key: el.getAttribute('data-hide-key'),
        label: el.getAttribute('data-hide-label') || el.getAttribute('data-hide-key'),
        element: el
      }))
      .sort((a, b) => itemOrder.indexOf(a.key) - itemOrder.indexOf(b.key));
    const submenuKeys = new Set(['theme', 'font']);
    const nestedKeys = new Set(['theme', 'font', 'weather']);
    const actionAttrs = item => {
      const accessibleName = ` aria-label="设置${item.label}" title="设置${item.label}"`;
      if (submenuKeys.has(item.key)) {
        return ` aria-haspopup="true" aria-expanded="false" aria-controls="tb-${item.key}-submenu"${accessibleName}`;
      }
      if (item.key === 'weather') return ` aria-haspopup="dialog"${accessibleName}`;
      return ` aria-pressed="false"${accessibleName}`;
    };

    panel.innerHTML =
      '<div class="tb-hide-title">工具按钮显隐与设置</div>' +
      items.map(it =>
        `<div class="tb-hide-row">` +
          `<label class="tb-visibility-control" title="显示/隐藏${it.label}">` +
            `<input type="checkbox" data-key="${it.key}" aria-label="在标题栏显示${it.label}" ${tbHidden[it.key] ? '' : 'checked'}>` +
            `<span class="tb-eye" aria-hidden="true">` +
              `<svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>` +
              `<circle cx="12" cy="12" r="2.6"></circle><path class="tb-eye-slash" d="M4 4l16 16"></path></svg>` +
            `</span>` +
          `</label>` +
          `<span class="tb-hide-label">${it.label}</span>` +
          `<button type="button" class="tb-setting-btn${nestedKeys.has(it.key) ? ' has-submenu' : ''}" data-setting-key="${it.key}"` +
            `${actionAttrs(it)}></button>` +
        `</div>`
      ).join('');

    function buildThemeSubmenu() {
      const menu = document.createElement('div');
      menu.id = 'tb-theme-submenu';
      menu.className = 'tb-submenu';
      menu.innerHTML = '<div class="tb-submenu-title">主题设置</div>';
      const grid = document.createElement('div');
      grid.className = 'tb-theme-grid';
      document.querySelectorAll('#theme-picker .t-dot').forEach(dot => {
        const option = document.createElement('button');
        option.type = 'button';
        option.className = 'tb-theme-opt';
        option.dataset.theme = dot.dataset.theme;
        option.innerHTML = '<span class="tb-theme-swatch"></span><span></span>';
        option.querySelector('.tb-theme-swatch').style.background = dot.style.background;
        option.querySelector('span:last-child').textContent = dot.title;
        option.addEventListener('click', e => {
          e.stopPropagation();
          dot.dispatchEvent(new MouseEvent('click', { bubbles: false }));
          syncThemeSubmenu();
        });
        grid.appendChild(option);
      });
      menu.appendChild(grid);
      return menu;
    }

    function buildFontSubmenu() {
      const menu = document.createElement('div');
      menu.id = 'tb-font-submenu';
      menu.className = 'tb-submenu';
      menu.innerHTML = '<div class="tb-submenu-title">字体设置</div>';
      [['中文', CN_FONTS], ['英数', EN_FONTS]].forEach(([type, fonts]) => {
        const group = document.createElement('div');
        group.className = 'tb-font-group';
        const label = document.createElement('span');
        label.className = 'tb-font-label';
        label.textContent = type;
        const options = document.createElement('div');
        options.className = 'tb-font-options';
        fonts.forEach(font => {
          const option = document.createElement('button');
          option.type = 'button';
          option.className = 'tb-font-opt';
          option.dataset.fontType = type;
          option.dataset.fontLabel = font.label;
          option.textContent = font.label;
          option.style.fontFamily = `'${font.local}'`;
          option.addEventListener('click', e => {
            e.stopPropagation();
            const sourceRow = Array.from(document.querySelectorAll('#font-picker-panel .fp-row'))
              .find(row => row.querySelector('.fp-label')?.textContent === type);
            const sourceOption = sourceRow && Array.from(sourceRow.querySelectorAll('.fp-opt'))
              .find(opt => opt.textContent === font.label);
            sourceOption?.dispatchEvent(new MouseEvent('click', { bubbles: false }));
            syncFontSubmenu();
          });
          options.appendChild(option);
        });
        group.append(label, options);
        menu.appendChild(group);
      });
      return menu;
    }

    const themeSubmenu = buildThemeSubmenu();
    const fontSubmenu = buildFontSubmenu();
    document.body.append(themeSubmenu, fontSubmenu);
    let activeSubmenu = null;
    let activeAnchor = null;

    function syncSettingActions() {
      const states = {
        expired: {
          on: !hideExpired,
          description: hideExpired ? '往日已隐藏' : '往日已显示'
        },
        spborder: {
          on: document.body.classList.contains('sp-borders'),
          description: document.body.classList.contains('sp-borders') ? '边框已显示' : '边框已隐藏'
        },
        sponly: {
          on: !spOnlyMode,
          description: spOnlyMode ? '当前为简易模式' : '当前为完整日历'
        }
      };
      Object.entries(states).forEach(([key, state]) => {
        const action = panel.querySelector(`.tb-setting-btn[data-setting-key="${key}"]`);
        if (!action) return;
        action.classList.toggle('is-on', state.on);
        action.setAttribute('aria-pressed', String(state.on));
        action.setAttribute('aria-label', state.description);
        action.title = state.description;
      });
    }

    const settingStateObserver = new MutationObserver(syncSettingActions);
    items.filter(item => !nestedKeys.has(item.key)).forEach(item => {
      settingStateObserver.observe(item.element, { attributes: true, attributeFilter: ['class'] });
    });

    function syncThemeSubmenu() {
      const current = document.documentElement.getAttribute('data-theme') || 'ocean';
      themeSubmenu.querySelectorAll('.tb-theme-opt').forEach(option =>
        option.classList.toggle('active', option.dataset.theme === current)
      );
    }

    function syncFontSubmenu() {
      const currentCN = localStorage.getItem('cal-font-cn') || '微软雅黑';
      const currentEN = localStorage.getItem('cal-font-en') || 'hooge 05_55';
      fontSubmenu.querySelectorAll('.tb-font-opt').forEach(option => {
        const current = option.dataset.fontType === '中文' ? currentCN : currentEN;
        option.classList.toggle('active', option.dataset.fontLabel === current);
      });
    }

    function positionSubmenu(menu, anchor) {
      menu.style.visibility = 'hidden';
      menu.classList.add('open');
      const anchorRect = anchor.getBoundingClientRect();
      const menuRect = menu.getBoundingClientRect();
      let left = anchorRect.left - menuRect.width - 8;
      if (left < 8) left = anchorRect.right + 8;
      if (left + menuRect.width > window.innerWidth - 8) left = Math.max(8, window.innerWidth - menuRect.width - 8);
      let top = anchorRect.top - 8;
      if (top + menuRect.height > window.innerHeight - 8) top = Math.max(8, window.innerHeight - menuRect.height - 8);
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
      menu.style.visibility = '';
    }

    function closeSubmenus() {
      [themeSubmenu, fontSubmenu].forEach(menu => menu.classList.remove('open'));
      panel.querySelectorAll('.tb-setting-btn').forEach(action => {
        action.classList.remove('active');
        if (action.hasAttribute('aria-expanded')) action.setAttribute('aria-expanded', 'false');
      });
      activeSubmenu = null;
      activeAnchor = null;
    }

    function openSubmenu(key, anchor) {
      const menu = key === 'theme' ? themeSubmenu : fontSubmenu;
      if (activeSubmenu === menu) { closeSubmenus(); return; }
      closeSubmenus();
      document.getElementById('font-picker-panel')?.classList.remove('open');
      if (key === 'theme') syncThemeSubmenu(); else syncFontSubmenu();
      anchor.classList.add('active');
      anchor.setAttribute('aria-expanded', 'true');
      activeSubmenu = menu;
      activeAnchor = anchor;
      positionSubmenu(menu, anchor);
    }

    applyToolbarHidden();
    syncSettingActions();

    const positionPanel = () => {
      const r = btn.getBoundingClientRect();
      panel.style.top = (r.bottom + 6) + 'px';
      const pw = panel.offsetWidth || 220;
      let left = r.right - pw;
      if (left < 8) left = 8;
      panel.style.left = left + 'px';
      panel.style.transform = '';
    };

    btn.addEventListener('click', e => {
      e.stopPropagation();
      const opening = !panel.classList.contains('open');
      panel.classList.toggle('open', opening);
      closeSubmenus();
      if (opening) {
        syncSettingActions();
        positionPanel();
      }
    });

    panel.addEventListener('click', e => {
      e.stopPropagation();
      const action = e.target.closest('.tb-setting-btn[data-setting-key]');
      if (!action) return;
      e.preventDefault();
      const key = action.dataset.settingKey;
      if (submenuKeys.has(key)) {
        openSubmenu(key, action);
        return;
      }
      closeSubmenus();
      const item = items.find(candidate => candidate.key === key);
      const trigger = item?.element.matches('button') ? item.element : item?.element.querySelector('button');
      if (!trigger) return;
      const r = action.getBoundingClientRect();
      trigger.dispatchEvent(new MouseEvent('click', {
        bubbles: false,
        clientX: r.left + r.width / 2,
        clientY: r.bottom
      }));
      syncSettingActions();
    });

    panel.addEventListener('change', e => {
      const cb = e.target;
      if (!cb.matches('input[type=checkbox][data-key]')) return;
      const key = cb.dataset.key;
      // checked = 显示；unchecked = 隐藏
      if (cb.checked) delete tbHidden[key]; else tbHidden[key] = true;
      localStorage.setItem('cal-tb-hidden', JSON.stringify(tbHidden));
      applyToolbarHidden();
      if (typeof scheduleSave === 'function') scheduleSave();
    });

    [themeSubmenu, fontSubmenu].forEach(menu => menu.addEventListener('click', e => e.stopPropagation()));
    document.addEventListener('click', () => {
      panel.classList.remove('open');
      closeSubmenus();
    });
    window.addEventListener('resize', () => {
      if (panel.classList.contains('open')) positionPanel();
      if (activeSubmenu && activeAnchor) positionSubmenu(activeSubmenu, activeAnchor);
    });
  }

  function initSpBorderToggle() {
    const btn = document.getElementById('sp-border-btn');
    if (!btn) return;
    let on = localStorage.getItem('sp-card-border');
    on = on === null ? true : on === 'true';
    const apply = () => {
      document.body.classList.toggle('sp-borders', on);
      btn.classList.toggle('primary', on);
      btn.title = on ? '隐藏特殊日期卡片边框' : '显示特殊日期卡片边框';
    };
    apply();
    btn.addEventListener('click', e => {
      e.stopPropagation();
      on = !on;
      localStorage.setItem('sp-card-border', on);
      apply();
    });
  }

  function initSpecialsBarGlow() {
    const bar = document.getElementById('specials-bar');
    bar.style.background = '';
    bar.style.position = 'relative';
    bar.style.zIndex = '0';

    const styleId = '_sp-glow-style';
    if (!document.getElementById(styleId)) {
      const s = document.createElement('style');
      s.id = styleId;
      s.textContent =
        `#specials-bar::before,#specials-bar::after{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;transition:opacity .3s}` +
        `#specials-bar::before{opacity:var(--eg-op,1);background:` +
        `radial-gradient(circle at 0% 0%,color-mix(in srgb,var(--c-accent) 6%,transparent) 0%,transparent 55%),` +
        `radial-gradient(circle at 100% 0%,color-mix(in srgb,var(--c-accent) 6%,transparent) 0%,transparent 55%),` +
        `radial-gradient(circle at 0% 100%,color-mix(in srgb,var(--c-accent) 6%,transparent) 0%,transparent 55%),` +
        `radial-gradient(circle at 100% 100%,color-mix(in srgb,var(--c-accent) 6%,transparent) 0%,transparent 55%),` +
        `var(--c-specials-bg)}` +
        `#specials-bar::after{opacity:var(--cg-op,0);background:radial-gradient(circle at var(--glow-x,50%) var(--glow-y,50%),` +
        `color-mix(in srgb,var(--c-accent) 20%,transparent) 0%,transparent 50%)}`;
      document.head.appendChild(s);
    }

    let frame;
    bar.addEventListener('mousemove', e => {
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        const rect = bar.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
        const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
        bar.style.setProperty('--glow-x', x + '%');
        bar.style.setProperty('--glow-y', y + '%');
        bar.style.setProperty('--eg-op', '0');
        bar.style.setProperty('--cg-op', '1');
      });
    });
    bar.addEventListener('mouseleave', () => {
      cancelAnimationFrame(frame);
      bar.style.setProperty('--eg-op', '1');
      bar.style.setProperty('--cg-op', '0');
    });
  }

  function initThemePicker() {
    const dots = document.querySelectorAll('.t-dot');
    const cur  = document.documentElement.getAttribute('data-theme') || 'ocean';
    dots.forEach(btn => {
      btn.classList.toggle('active', btn.dataset.theme === cur);
      btn.addEventListener('click', () => {
        const t = btn.dataset.theme;
        document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('cal-theme', t);
        dots.forEach(b => b.classList.toggle('active', b.dataset.theme === t));
        scheduleSave();
      });
    });
  }

  function applyFontStyle() {
    const cnLabel = localStorage.getItem('cal-font-cn') || '微软雅黑';
    const enLabel = localStorage.getItem('cal-font-en') || 'hooge 05_55';
    const activeCN = CN_FONTS.find(f => f.label === cnLabel) || CN_FONTS[4];
    const activeEN = EN_FONTS.find(f => f.label === enLabel) || EN_FONTS[0];
    let s = document.getElementById('_font_style');
    if (!s) { s = document.createElement('style'); s.id = '_font_style'; document.head.appendChild(s); }
    s.textContent =
      `@font-face{font-family:_ccn;src:local('${activeCN.local}');unicode-range:U+4E00-U+9FFF,U+3400-U+4DBF,U+F900-U+FAFF,U+2E80-U+2EFF,U+3000-U+303F,U+3040-U+309F,U+30A0-U+30FF,U+FF00-U+FFEF}` +
      `body{font-family:'${activeEN.local}',_ccn,'${activeCN.local}',sans-serif!important}`;
  }

  function initFontPicker() {
    const savedCN = localStorage.getItem('cal-font-cn') || '微软雅黑';
    const savedEN = localStorage.getItem('cal-font-en') || 'hooge 05_55';
    let activeCN = CN_FONTS.find(f => f.label === savedCN) || CN_FONTS[4];
    let activeEN = EN_FONTS.find(f => f.label === savedEN) || EN_FONTS[0];
    applyFontStyle();

    const wrap  = document.getElementById('font-picker-wrap');
    const btn   = document.getElementById('font-btn');
    const panel = document.createElement('div');
    panel.id = 'font-picker-panel';

    function buildRow(labelText, fonts, getActive, setActive) {
      const row = document.createElement('div');
      row.className = 'fp-row';
      const lbl = document.createElement('span');
      lbl.className = 'fp-label';
      lbl.textContent = labelText;
      row.appendChild(lbl);
      fonts.forEach(f => {
        const opt = document.createElement('button');
        opt.className = 'fp-opt' + (f === getActive() ? ' active' : '');
        opt.textContent = f.label;
        opt.style.fontFamily = `'${f.local}'`;
        opt.addEventListener('click', e => {
          e.stopPropagation();
          setActive(f);
          row.querySelectorAll('.fp-opt').forEach(o => o.classList.remove('active'));
          opt.classList.add('active');
        });
        row.appendChild(opt);
      });
      return row;
    }

    panel.appendChild(buildRow('中文', CN_FONTS,
      () => activeCN,
      f => { activeCN = f; localStorage.setItem('cal-font-cn', f.label); applyFontStyle(); scheduleSave(); }
    ));
    panel.appendChild(buildRow('英数', EN_FONTS,
      () => activeEN,
      f => { activeEN = f; localStorage.setItem('cal-font-en', f.label); applyFontStyle(); scheduleSave(); }
    ));
    document.body.appendChild(panel);

    const GAP = 0;
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (!panel.classList.contains('open')) {
        panel.style.top = (document.getElementById('sticky-top').getBoundingClientRect().bottom + GAP) + 'px';
      }
      panel.classList.toggle('open');
    });
    panel.addEventListener('click', e => e.stopPropagation());
    document.addEventListener('click', () => panel.classList.remove('open'));

    new MutationObserver(() => {
      if (!panel.classList.contains('open')) return;
      let t0 = null;
      const follow = ts => {
        if (!t0) t0 = ts;
        panel.style.top = (document.getElementById('sticky-top').getBoundingClientRect().bottom + GAP) + 'px';
        if (ts - t0 < 800) requestAnimationFrame(follow);
      };
      requestAnimationFrame(follow);
    }).observe(document.getElementById('sticky-top'), { attributes: true, attributeFilter: ['style'] });
  }

  init();
</script>
<div id="delete-toast"></div>
<div id="year-toast"></div>
</body>
